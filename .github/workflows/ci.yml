name: CI
on:
  push: {branches: [main, develop]}
  pull_request: {branches: [main]}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/agentflow_test
          REDIS_URL: redis://localhost:6379/0
          AGENTFLOW_API_KEY: test-key-min-16-chars
          JWT_SECRET: test-jwt-secret-min-32-chars-long
      - uses: codecov/codecov-action@v4
        with: {file: ./coverage.xml, fail_ci_if_error: false}
